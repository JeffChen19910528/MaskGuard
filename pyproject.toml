[project]
name = "maskguard"
version = "0.1.0"
description = "Image sensitive-data detection and redaction pipeline"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "PyYAML>=6.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Phase 8.1: the HTTP API layer (maskguard/api/) is optional — CLI-only
# installs (`pip install maskguard`) never require these. Install with
# `pip install -e ".[api]"` to run the FastAPI server.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    # Phase 10.2: enterprise OIDC authentication foundation.
    # `httpx` — OIDC discovery/token-endpoint/JWKS HTTP calls (async,
    # bounded timeouts, already a mature/maintained client rather than a
    # hand-rolled one).
    # `pyjwt[crypto]` — ID token signature verification (RSA/EC via the
    # bundled `cryptography` backend) and JWKS-based key selection; never
    # a hand-rolled JWT/crypto implementation (Phase 10.2 §74).
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    # Phase 10.6: shared distributed state (session/review-replay/
    # rate-limit) when REDIS_ENABLED=true — the official `redis-py`
    # client (async support built in since 4.2, no separate
    # `aioredis` package). Unused/import-deferred when REDIS_ENABLED is
    # unset (§0's opt-in pattern, matching every prior Phase 10.x control).
    "redis>=5.0",
]
# Phase 9.1 §7: test-only deps, never installed in the production image.
# `httpx2` is required transitively by `starlette.testclient.TestClient`
# at the locked starlette version (see requirements.lock) — production
# code never imports `starlette.testclient`, so production never needs it;
# it's here purely so `pytest -m api` (which does use TestClient) has a
# reproducible, locked dependency set (requirements-test.lock) matching
# what the production base image would actually resolve.
test = [
    "pytest>=7.4",
    "httpx2",
    # Phase 9.1 §19-20 finding: tests/api/test_security_hardening.py
    # imports the classic `httpx` package directly (for raw streaming/
    # content-length control the starlette.testclient/httpx2 combo doesn't
    # expose) and uses `@pytest.mark.asyncio` in one test — neither was
    # ever declared here; they happened to already be present in this
    # session's host Python environment from an untracked prior install,
    # which is exactly the kind of undeclared-dependency reproducibility
    # gap this phase exists to close. Discovered by actually running the
    # full test suite inside a freshly-locked container (not assumed).
    "httpx",
    "pytest-asyncio",
]

[project.scripts]
imgmask = "maskguard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maskguard*"]

[tool.pytest.ini_options]
markers = [
    "e2e: real-Tesseract end-to-end pipeline tests; requires the Tesseract binary + language data installed (see README.md). Excluded from the default `pytest` run.",
    "benchmark: OCR engine benchmark suite (tests/ocr_benchmark/); the full-dataset run requires Tesseract. Excluded from the default `pytest` run — use `pytest -m benchmark`.",
    "api: FastAPI HTTP layer tests (tests/api/); requires the `api` extra (`pip install -e \".[api]\"`) and some require Tesseract too. Excluded from the default `pytest` run — use `pytest -m api`.",
]
addopts = "-m \"not e2e and not benchmark and not api\""
