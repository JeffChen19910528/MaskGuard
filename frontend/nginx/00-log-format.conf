# http-context only (Phase 9 §34/§35) — auto-included by the base image's
# nginx.conf via `include /etc/nginx/conf.d/*.conf;`, unlike common.conf.inc
# (server-context directives, deliberately rendered OUTSIDE conf.d and
# included explicitly from inside each server{} block — see entrypoint.sh).
# Static, no env-var substitution needed, so it ships as-is rather than as
# a .template.
log_format maskguard '$remote_addr - [$time_local] "$request_method $uri" '
                      '$status $body_bytes_sent "$http_referer" $request_time';
